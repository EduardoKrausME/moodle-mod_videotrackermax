name: Syntax checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP lint
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: XML syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in pathlib.Path('.').rglob('*.xml'):
              ET.parse(path)
              print(f'OK {path}')
          PY
